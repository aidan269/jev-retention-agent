<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1510" role="img" aria-labelledby="title description">
  <title id="title">Retention Bot workflow</title>
  <desc id="description">Battery readings are checked for crossings at 30 and 25 percent. Claude drafts an update, the customer replies through the CLI, and Jev assesses the reply. Escalations create a HubSpot follow-up task; other assessments are saved.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d9d9d9" />
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#171717" />
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#f04f91" />
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #171717; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .node { fill: #fff; stroke: #171717; stroke-width: 3; }
      .flow { fill: none; stroke: #171717; stroke-width: 3; marker-end: url(#arrow); }
      .decision { fill: #f7f7f7; stroke: #171717; stroke-width: 3; }
      .label { font-size: 15px; font-weight: 700; }
      .detail { font-size: 17px; fill: #575757; }
      text.header-label, text.dark-text { fill: #fff; }
    </style>
  </defs>

  <rect width="1080" height="1510" fill="#fff" />
  <rect x="0" y="0" width="1080" height="1510" fill="url(#dots)" opacity=".38" />
  <rect x="0" y="0" width="1080" height="168" fill="#f04f91" />
  <rect x="0" y="0" width="1080" height="168" fill="url(#dots)" opacity=".55" />
  <rect x="44" y="34" width="208" height="30" fill="#171717" />
  <text x="58" y="55" class="mono header-label" font-size="14">TYPESAFE AI / WORKFLOW</text>
  <text x="44" y="112" font-size="38" font-weight="750">Retention Bot</text>
  <text x="46" y="143" class="mono" font-size="14">THRESHOLD ALERTS · CUSTOMER CARE · HUMAN ESCALATION</text>
  <text x="1036" y="53" text-anchor="end" class="mono" font-size="14">V1.0</text>

  <rect x="315" y="205" width="450" height="80" rx="4" class="node" />
  <circle cx="354" cy="245" r="18" fill="#f04f91" />
  <text x="354" y="251" text-anchor="middle" font-size="16" font-weight="700">01</text>
  <text x="390" y="251" font-size="23" font-weight="700">Battery reading arrives</text>
  <path d="M540 285V333" class="flow" />

  <path d="M540 340 750 415 540 490 330 415Z" class="decision" />
  <text x="540" y="407" text-anchor="middle" font-size="19" font-weight="700">Crossed 30% or 25% since</text>
  <text x="540" y="434" text-anchor="middle" font-size="19" font-weight="700">the previous reading?</text>
  <path d="M750 415H850" fill="none" stroke="#171717" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="860" y="376" width="176" height="78" rx="4" fill="#fff" stroke="#171717" stroke-width="2" />
  <text x="948" y="402" text-anchor="middle" class="mono label">NO CROSSING</text>
  <text x="948" y="428" text-anchor="middle" font-size="16">Keep monitoring</text>
  <rect x="553" y="478" width="48" height="25" rx="12" fill="#f04f91" />
  <text x="577" y="496" text-anchor="middle" class="mono" font-size="13" font-weight="700">YES</text>
  <path d="M540 490V541" fill="none" stroke="#f04f91" stroke-width="4" marker-end="url(#arrow-pink)" />

  <rect x="315" y="550" width="450" height="84" rx="4" class="node" />
  <circle cx="354" cy="592" r="18" fill="#b9eff0" />
  <text x="354" y="598" text-anchor="middle" font-size="16" font-weight="700">02</text>
  <text x="390" y="588" font-size="22" font-weight="700">Claude drafts an update</text>
  <text x="390" y="614" class="detail">Using the actual battery reading</text>
  <path d="M540 634V681" class="flow" />

  <rect x="315" y="690" width="450" height="84" rx="4" class="node" />
  <circle cx="354" cy="732" r="18" fill="#b9eff0" />
  <text x="354" y="738" text-anchor="middle" font-size="16" font-weight="700">03</text>
  <text x="390" y="728" font-size="22" font-weight="700">Customer reply via CLI</text>
  <text x="390" y="754" class="detail">Reply is entered for assessment</text>
  <path d="M540 774V821" class="flow" />

  <rect x="315" y="830" width="450" height="84" rx="4" class="node" />
  <circle cx="354" cy="872" r="18" fill="#f04f91" />
  <text x="354" y="878" text-anchor="middle" font-size="16" font-weight="700">04</text>
  <text x="390" y="868" font-size="22" font-weight="700">Jev assesses the reply</text>
  <text x="390" y="894" class="detail">Checks whether the reply needs escalation</text>
  <path d="M540 914V960" class="flow" />

  <path d="M540 968 730 1036 540 1104 350 1036Z" class="decision" />
  <text x="540" y="1032" text-anchor="middle" font-size="21" font-weight="700">Escalation flagged?</text>
  <path d="M730 1036H850" fill="none" stroke="#171717" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="860" y="997" width="176" height="78" rx="4" fill="#fff" stroke="#171717" stroke-width="2" />
  <text x="948" y="1023" text-anchor="middle" class="mono label">NO</text>
  <text x="948" y="1049" text-anchor="middle" font-size="16">Save assessment</text>
  <rect x="553" y="1092" width="48" height="25" rx="12" fill="#f04f91" />
  <text x="577" y="1110" text-anchor="middle" class="mono" font-size="13" font-weight="700">YES</text>
  <path d="M540 1104V1151" fill="none" stroke="#f04f91" stroke-width="4" marker-end="url(#arrow-pink)" />

  <rect x="315" y="1160" width="450" height="84" rx="4" fill="#171717" stroke="#171717" stroke-width="3" />
  <circle cx="354" cy="1202" r="18" fill="#f04f91" />
  <text x="354" y="1208" text-anchor="middle" font-size="16" font-weight="700">05</text>
  <text x="390" y="1198" class="dark-text" font-size="22" font-weight="700">Escalation flagged</text>
  <text x="390" y="1224" class="dark-text" font-size="17" opacity=".82">Customer concern needs follow-up</text>
  <path d="M540 1244V1291" class="flow" />

  <rect x="315" y="1300" width="450" height="84" rx="4" fill="#b9eff0" stroke="#171717" stroke-width="3" />
  <circle cx="354" cy="1342" r="18" fill="#fff" stroke="#171717" stroke-width="2" />
  <text x="354" y="1348" text-anchor="middle" font-size="16" font-weight="700">06</text>
  <text x="390" y="1338" font-size="22" font-weight="700">Create HubSpot task</text>
  <text x="390" y="1364" class="detail">Follow-up linked to the customer contact</text>

  <path d="M44 1420H1036" stroke="#171717" stroke-width="2" />
  <text x="44" y="1455" class="mono" font-size="13" font-weight="700">TYPESAFE AI</text>
  <text x="1036" y="1455" text-anchor="end" class="mono" font-size="13">DECISIONS THAT SOFTWARE CAN ACT ON</text>
</svg>